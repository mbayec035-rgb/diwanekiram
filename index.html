<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS n'utilise pas toujours les icônes du manifest pour l'écran d'accueil. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <!-- Mode application autonome sur iOS (Safari) et Android. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DiwaneKiram" />
    <!-- `black` plutôt que `black-translucent` : la barre supérieure est fixe et
         ne réserve pas encore env(safe-area-inset-top), le contenu passerait
         sous l'encoche. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta
      name="description"
      content="DiwaneKiram — bibliothèque numérique des xassidas : texte arabe, transcription phonétique et traduction française, lisible hors ligne."
    />
    <title>DiwaneKiram — Bibliothèque des Xassidas</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter tout clignotement.
      try {
        const raw = localStorage.getItem('dk.settings')
        const theme = raw ? JSON.parse(raw).state.theme : 'system'
        const resolved =
          theme === 'system'
            ? window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
            : theme
        document.documentElement.dataset.theme = resolved
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>DiwaneKiram nécessite JavaScript pour afficher la bibliothèque.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
